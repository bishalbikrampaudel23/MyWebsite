<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Owner Inbox | Bishal Bikram Paudel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="inbox.js"></script>
</head>
<body>
  <header class="top scrolled">
    <a class="brand" href="index.html">Bishal Bikram Paudel</a>
    <nav aria-label="Main navigation">
      <a href="index.html#faq">General Queries</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>
  <main class="inbox-page">
    <div class="inbox-app">
      <h1>Private query inbox</h1>
      <p>Visitor messages are private. Replies are sent to the email address provided by each visitor.</p>
      <section class="inbox-login" id="login-section" aria-labelledby="login-title">
        <h2 id="login-title">Owner sign in</h2>
        <form id="login-form">
          <div>
            <label for="admin-password">Inbox password</label>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div>
            <label for="admin-otp">Authenticator code</label>
            <input id="admin-otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
          </div>
          <button type="submit">Sign in</button>
          <p class="inbox-status" id="login-status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section id="inbox-section" class="inbox-hidden" aria-labelledby="inbox-title">
        <div class="inbox-toolbar">
          <h2 id="inbox-title">Messages</h2>
          <button type="button" id="logout-button">Sign out</button>
        </div>
        <p class="inbox-status" id="inbox-status" role="status" aria-live="polite"></p>
        <div class="inbox-list" id="inbox-list"></div>
        <button class="query-action secondary inbox-hidden" type="button" id="older-button">Load older queries</button>
      </section>
    </div>
  </main>
</body>
</html>
